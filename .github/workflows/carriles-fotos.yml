# Carriles de las fotos del PNOA para las autopistas y autovías de OpenStreetMap sin «lanes».
# Cada dos meses (después de la vuelta del IGN) y a mano. Cuatro trozos a la vez; al final se junta
# con los del IGN y se publica como la última versión (la que baja regiones.sh).
name: Carriles de las fotos
on:
  schedule:
    - cron: "17 3 3 */2 *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos como mucho de cada trozo"
        default: "300"
permissions:
  contents: write
jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Programas
        run: pip install --quiet osmium numpy scipy pillow
      - name: OpenStreetMap de España (Geofabrik)
        run: |
          mkdir -p trabajo
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 20 -o trabajo/spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
      - name: Detectar
        working-directory: carriles-fotos
        env:
          CACHE_TESELAS: /tmp/pnoa
          PARTE: ${{ matrix.parte }}
          PARTES: "4"
          HILOS: "6"
        run: python3 detectar.py ../trabajo/spain.osm.pbf ../trabajo/fotos-${{ matrix.parte }}.csv ../trabajo/fotos-${{ matrix.parte }}.json "${{ inputs.minutos || '300' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fotos-${{ matrix.parte }}
          path: trabajo/fotos-${{ matrix.parte }}.*
  publicar:
    needs: detectar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: partes
          merge-multiple: true
      - name: Juntar con los del IGN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p salida
          gh release download --pattern espana-ign-carriles.jsonl.gz --pattern espana-carriles.csv.gz -D ign \
            "$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("espana-"))][0].tagName')"
          head -q -n1 partes/fotos-0.csv > salida/espana-fotos-carriles.csv
          tail -q -n +2 partes/fotos-*.csv >> salida/espana-fotos-carriles.csv
          gzip -9 salida/espana-fotos-carriles.csv
          python3 carriles-fotos/unir.py ign/espana-carriles.csv.gz salida/espana-carriles.csv.gz salida/espana-carriles.json partes/fotos-*.csv
          cp ign/espana-ign-carriles.jsonl.gz salida/
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fotos-$(date -u +%Y-%m-%d-%H%M)"
          {
            echo "Carriles de España: IGN (IGR Redes de Transporte) + fotos del PNOA (© IGN, CC BY 4.0) para las vías de OpenStreetMap que no los tienen."
            echo
            echo '```json'
            cat salida/espana-carriles.json
            echo '```'
          } > notas.md
          gh release create "$TAG" salida/espana-carriles.csv.gz salida/espana-carriles.json salida/espana-fotos-carriles.csv.gz salida/espana-ign-carriles.jsonl.gz \
            --title "España · carriles con fotos · $(date -u +%d/%m/%Y)" --notes-file notas.md --latest

# Carriles para pintarlos en el mapa de ClusterRide (teselas PMTiles, capa «carriles»), cada dos meses después del
# cruce con el IGN (espana.yml, el día 1) y a mano desde «Actions». Se publica en la versión fija «mapa-carriles»:
# https://github.com/ised-sp/clusterride-mapas-datos/releases/download/mapa-carriles/carriles.pmtiles
# El Plesk lo baja con regiones.sh a /opt/clusterride-mapas/datos/carriles.pmtiles (https://clusterride.clusterapps.es/mapas/carriles.pmtiles).
name: Mapa · carriles
on:
  schedule:
    - cron: "41 5 3 */2 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carriles-mapa
  cancel-in-progress: false
jobs:
  carriles:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool >/dev/null
          sudo apt-get install -y -qq tippecanoe >/dev/null 2>&1 || {
            git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -C /tmp/tc -j4 >/dev/null && sudo make -C /tmp/tc install >/dev/null; }
          pip install --quiet osmium
          tippecanoe --version; osmium --version | head -1
      - name: OpenStreetMap (España, Portugal y Andorra) y carriles del IGN
        run: |
          mkdir -p trabajo salida
          for p in spain portugal andorra; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 20 --max-time 1800 -o trabajo/$p.osm.pbf https://download.geofabrik.de/europe/$p-latest.osm.pbf || \
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 20 --max-time 1800 -o trabajo/$p.osm.pbf https://download.openstreetmap.fr/extracts/europe/$p-latest.osm.pbf
          done
          curl -fsSL --retry 3 -o trabajo/espana-carriles.csv.gz https://github.com/${{ github.repository }}/releases/latest/download/espana-carriles.csv.gz
          ls -lh trabajo
      - name: Calzadas con carriles
        run: |
          : > trabajo/carriles.geojsonl
          for p in spain portugal andorra; do
            osmium tags-filter -O -o trabajo/$p-vias.osm.pbf trabajo/$p.osm.pbf \
              w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential
            python3 mapa/carriles_mapa.py trabajo/$p-vias.osm.pbf trabajo/espana-carriles.csv.gz >> trabajo/carriles.geojsonl
          done
          wc -l trabajo/carriles.geojsonl
      - name: Teselas
        run: |
          tippecanoe -o salida/carriles.pmtiles -l carriles -Z14 -z14 --no-feature-limit --no-tile-size-limit \
            --attribution "© OpenStreetMap · Carriles: IGN (IGR-RT, CC BY 4.0)" --force -P trabajo/carriles.geojsonl
          ls -lh salida
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mapa-carriles --yes --cleanup-tag 2>/dev/null || true
          gh release create mapa-carriles salida/carriles.pmtiles --latest=false \
            --title "Mapa · carriles · $(date -u +%d/%m/%Y)" \
            --notes "Calzadas de España, Portugal y Andorra con su número de carriles (OpenStreetMap y, donde no los tiene, IGN) para el mapa de ClusterRide. $(wc -l < trabajo/carriles.geojsonl) calzadas."
